name: build-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  REGISTRY_IMAGE: git.mke.one/images/triumvirat
jobs:
  build-deploy:
    runs-on: docker
    container:
      image: docker:29-cli
    steps:
      - name: Checkout
        run: |
          apk add --no-cache git >/dev/null
          git clone --depth 1 -b "$GITHUB_REF_NAME" "https://mke-ci:${MKE_CI_TOKEN}@git.mke.one/${GITHUB_REPOSITORY}.git" /workspace/src
        env:
          MKE_CI_TOKEN: ${{ secrets.MKE_CI_TOKEN }}
      - name: Build und Push
        run: |
          TAG=$(echo "$GITHUB_SHA" | cut -c1-8)
          IMAGE="$REGISTRY_IMAGE:$TAG"
          case "$IMAGE" in
            git.mke.one/images/triumvirat:*) ;;
            *) echo "ungueltiges Registry-Ziel: $IMAGE" >&2; exit 1 ;;
          esac
          echo "$MKE_CI_TOKEN" | docker login git.mke.one -u mke-ci --password-stdin
          docker build -t "$IMAGE" /workspace/src
          docker push "$IMAGE"
          docker rmi "$IMAGE" || true
        env:
          MKE_CI_TOKEN: ${{ secrets.MKE_CI_TOKEN }}
      - name: Deploy ueber infra-Repo
        run: |
          TAG=$(echo "$GITHUB_SHA" | cut -c1-8)
          IMAGE="$REGISTRY_IMAGE:$TAG"
          git clone "https://mke-ci:${MKE_CI_TOKEN}@git.mke.one/thilo/infra.git" /workspace/infra
          cd /workspace/infra
          sed -i "s|image: git.mke.one/images/triumvirat:.*|image: $IMAGE|" manifests/triumvirat/deployment.yaml
          git config user.name "Forgejo Actions"
          git config user.email "ci@mke.one"
          git commit -am "triumvirat: Deploy $TAG" && git push || echo "keine Manifest-Aenderung"
        env:
          MKE_CI_TOKEN: ${{ secrets.MKE_CI_TOKEN }}
